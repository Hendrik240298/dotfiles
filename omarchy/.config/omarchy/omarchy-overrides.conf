general {
  gaps_in = 4
  gaps_out = 6
  border_size = 1
}

# US + US International, toggle with both Alt keys while keeping Right Alt as AltGr
input {
  kb_layout = us,us
  kb_variant = ,intl
  kb_options = compose:caps,grp:alt_altgr_toggle
}

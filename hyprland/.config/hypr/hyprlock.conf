$font = Sans

general {
    hide_cursor = false
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
}

input-field {
    monitor =
    size = 20%, 5%
    outline_thickness = 2
    inner_color = rgba(00000000)
    outer_color = rgba(ffffffff)
    check_color = rgba(ffffffff)
    fail_color = rgba(ff7777ff)
    font_color = rgb(ffffff)
    fade_on_empty = false
    rounding = 12
    font_family = $font
    placeholder_text = Password
    fail_text = $PAMFAIL
    dots_spacing = 0.3
    position = 0, -20
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    font_size = 90
    font_family = $font
    position = -30, 0
    halign = right
    valign = top
}
